<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuickView — Legal &amp; Docs</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #fff;
      --fg: #1f2330;
      --muted: #5c6170;
      --line: #d8dbe7;
      --accent: #0073ea;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      color: var(--fg);
      background:
        radial-gradient(900px 420px at 10% -10%, #e8f1ff 0%, transparent 60%),
        radial-gradient(700px 360px at 100% 0%, #e9fbff 0%, transparent 55%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 32px 16px;
    }
    main {
      width: min(520px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: -0.03em;
    }
    p { margin: 0 0 18px; color: var(--muted); }
    a.row {
      display: block;
      text-decoration: none;
      color: var(--fg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      margin: 0 0 10px;
      font-weight: 700;
    }
    a.row:hover { border-color: var(--accent); color: var(--accent); }
    .sub { display: block; margin-top: 4px; font-weight: 500; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>QuickView</h1>
    <p>monday.com Board View — docs for marketplace listing.</p>
    <a class="row" href="./howto.html">How to use<span class="sub">Install, add Board View, columns &amp; items</span></a>
    <a class="row" href="./pricing.html">Pricing<span class="sub">Trial + Pro plans</span></a>
    <a class="row" href="./legal.html#privacy">Privacy Policy<span class="sub">legal.html#privacy</span></a>
    <a class="row" href="./legal.html#terms">Terms of Service<span class="sub">legal.html#terms</span></a>
  </main>
</body>
</html>
